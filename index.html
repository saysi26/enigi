<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐶🌻 vs 🥊 — Il Duello</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f6f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input{font:inherit}
.wrap{max-width:900px;margin:auto;padding:24px}
.card{background:#151b31;border:1px solid #293252;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0005}
h1{font-size:clamp(28px,6vw,54px);margin:0 0 8px}
h2{margin-top:0}.muted{color:#9fa9c5}
.hero{text-align:center;padding:42px 20px}
.badges{font-size:52px;margin:12px}
input{width:100%;background:#0d1326;color:white;border:1px solid #36415f;border-radius:12px;padding:13px;margin:8px 0}
button{border:0;border-radius:12px;padding:13px 18px;background:#ffd447;color:#151515;font-weight:800;cursor:pointer;margin:6px 4px}
button.secondary{background:#27314f;color:white}
button.danger{background:#ff6575;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.hidden{display:none!important}
.code{font-size:30px;letter-spacing:7px;text-align:center;background:#0b1020;border-radius:14px;padding:16px;margin:14px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.player{padding:15px;border-radius:16px;background:#0d1326;border:1px solid #293252}
.player.active{border-color:#ffd447;box-shadow:0 0 0 2px #ffd44733}
.hearts{font-size:22px;letter-spacing:2px}
.choice{font-size:42px;padding:18px;background:#0d1326;border:1px solid #33405e;border-radius:16px;flex:1}
.choice:hover{transform:translateY(-2px)}
#gameArea{margin-top:18px}
.progress{height:8px;background:#080c18;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;width:0;background:#ffd447;transition:.4s}
.challenge{font-size:20px;line-height:1.5}
.log{max-height:180px;overflow:auto;background:#0b1020;border-radius:14px;padding:12px;color:#b9c2da}
.small{font-size:13px}
.success{color:#7ef0a3}.warning{color:#ffd447}.error{color:#ff8794}
@media(max-width:600px){.wrap{padding:12px}.card{padding:18px}.players{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<section id="lobby" class="card hero">
  <div class="badges">🐶 🌻 🥊</div>
  <h1>IL DUELLO</h1>
  <p class="muted">Una caccia al tesoro a distanza. Indizi, quiz, trappole e prove idiote.</p>
  <div id="setup">
    <input id="name" maxlength="18" placeholder="Il tuo nome">
    <div class="row">
      <button onclick="createRoom()">CREA STANZA</button>
      <button class="secondary" onclick="showJoin()">ENTRA IN UNA STANZA</button>
    </div>
    <div id="joinBox" class="hidden">
      <input id="roomCode" maxlength="8" placeholder="Codice stanza">
      <button onclick="joinRoom()">ENTRA</button>
    </div>
    <p id="status" class="muted small"></p>
  </div>
  <div id="waiting" class="hidden">
    <h2>Stanza pronta.</h2>
    <p>Mandale questo codice:</p>
    <div class="code" id="roomCodeDisplay"></div>
    <p class="muted">Quando entra, potete iniziare insieme.</p>
  </div>
</section>

<section id="game" class="hidden">
  <div class="card">
    <div class="row">
      <div><h2>🐶🌻 IL DUELLO 🥊</h2><div class="muted" id="roundText"></div></div>
      <div style="text-align:right"><span class="small">Stanza</span><div id="roomMini"></div></div>
    </div>
    <div class="players" id="players"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="gameArea"></div>
    <div class="log" id="log"></div>
  </div>
</section>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let peer, conn, isHost=false, myName='', mySymbol='', opponentName='', opponentSymbol='';
let room='', state=null, answered=false;

const rounds=[
 {type:'choice', title:'SCEGLI IL TUO ALLEATO', text:'Il tuo animale/oggetto ti accompagna nel duello. Scegli in fretta:', choices:['🐶 Bassotto','🌻 Girasole','🥊 Guantone'], answer:null},
 {type:'quiz', title:'L’INDOVINELLO', text:'Più ne togli, più diventa grande. Che cos’è?', choices:['Un buco','Un palloncino','Un cane','Un pugno'], answer:0},
 {type:'quiz', title:'LA TRAPPOLA', text:'Un pugile entra in un ring. Fa 3 passi avanti e 3 indietro. Quanti passi ha fatto?', choices:['3','6','9','Dipende dal ring'], answer:1},
 {type:'code', title:'IL CODICE', text:'A=1, B=2, C=3... Decifra: 7 - 9 - 18 - 1 - 19 - 15 - 12 - 5', answerText:'GIRASOLE'},
 {type:'quiz', title:'IL BASSOTTO BUGIARDO', text:'Un bassotto dice: “La frase che sto dicendo è falsa.” Se la frase è una normale frase del gioco, cosa succede?', choices:['È una frase paradossale','È sicuramente vera','È sicuramente falsa','Il bassotto perde una vita'], answer:0},
 {type:'challenge', title:'PROVA IDIOTA', text:'Per superare la prova devi mandare all’altro un messaggio vocale di massimo 7 secondi dicendo: “Sono ufficialmente più intelligente di un bassotto”, con voce da telecronista di boxe. Quando hai finito, premi FATTO.', answer:null},
 {type:'quiz', title:'ULTIMO INDIZIO', text:'Hai 3 fiammiferi. Devi ottenere esattamente 30 usando solo i numeri 10, 20 e 30, senza sommare due numeri.', choices:['Usa 30','10 × 3','20 + 10','Non si può'], answer:0}
];

function setStatus(t,c='muted'){let e=document.getElementById('status');e.textContent=t;e.className=c+' small'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addLog(s){let l=document.getElementById('log');l.innerHTML+=`<div>${esc(s)}</div>`;l.scrollTop=l.scrollHeight}
function send(o){if(conn&&conn.open)conn.send(o)}
function showJoin(){document.getElementById('joinBox').classList.remove('hidden')}

function createRoom(){
 myName=document.getElementById('name').value.trim()||'Giocatore 1'; isHost=true;
 room=Math.random().toString(36).slice(2,8).toUpperCase();
 peer=new Peer('duello-'+room);
 peer.on('open',()=>{document.getElementById('setup').classList.add('hidden');document.getElementById('waiting').classList.remove('hidden');document.getElementById('roomCodeDisplay').textContent=room;setStatus('In attesa dell’altro giocatore…')});
 peer.on('connection',c=>{conn=c; setupConn();});
 peer.on('error',e=>setStatus('Errore di connessione: '+e.type,'error'));
}

function joinRoom(){
 myName=document.getElementById('name').value.trim()||'Giocatore 2';
 room=document.getElementById('roomCode').value.trim().toUpperCase();
 if(!room)return;
 peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('duello-'+room,{reliable:true});setupConn()});
 peer.on('error',e=>setStatus('Codice non valido o stanza non disponibile.','error'));
}

function setupConn(){
 conn.on('open',()=>{
   send({type:'hello',name:myName});
   if(isHost){state={round:0,answers:{},started:false,finished:false};setTimeout(()=>sendState(),300)}
 });
 conn.on('data',handleData);
 conn.on('close',()=>addLog('Connessione chiusa.'));
}

function handleData(m){
 if(m.type==='hello'){
   opponentName=m.name;
   if(isHost){state.started=true;sendState();openGame();} else {send({type:'ready'});openGame();}
 }
 if(m.type==='ready'&&isHost){state.started=true;sendState();openGame();}
 if(m.type==='state'){state=m.state;opponentName=m.opponentName||opponentName;openGame();render();}
 if(m.type==='answer'){
   state.answers[m.round]=state.answers[m.round]||{};
   state.answers[m.round][m.who]=m.value;
   if(isHost)sendState();
   render();
 }
 if(m.type==='advance'&&isHost){state.round++;sendState();}
 if(m.type==='chatlog')addLog(m.text);
}

function sendState(){send({type:'state',state,opponentName});render()}
function openGame(){document.getElementById('lobby').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function myId(){return isHost?'host':'guest'}
function otherId(){return isHost?'guest':'host'}

function render(){
 if(!state)return;
 const r=Math.min(state.round,rounds.length-1), q=rounds[r];
 document.getElementById('roomMini').textContent=room;
 document.getElementById('roundText').textContent=`Prova ${r+1} / ${rounds.length}`;
 document.getElementById('bar').style.width=((r)/rounds.length*100)+'%';
 const myA=state.answers[r]?.[myId()], opA=state.answers[r]?.[otherId()];
 document.getElementById('players').innerHTML=`
 <div class="player ${myA!==undefined?'':'active'}"><b>Tu</b><br>${esc(myName)}<div class="hearts">❤️❤️❤️❤️❤️</div>${myA!==undefined?'<span class="success">✓ Risposta inviata</span>':''}</div>
 <div class="player"><b>Avversario</b><br>${esc(opponentName||'in attesa…')}<div class="hearts">❤️❤️❤️❤️❤️</div>${opA!==undefined?'<span class="success">✓ Ha risposto</span>':''}</div>`;
 if(state.finished){showFinish();return}
 let h=`<h2>${q.title}</h2><div class="challenge">${q.text}</div>`;
 if(q.type==='choice'||q.type==='quiz'){
   h+='<div class="row" style="margin-top:18px">';
   q.choices.forEach((x,i)=>h+=`<button class="choice" ${myA!==undefined?'disabled':''} onclick="answer(${i})">${esc(x)}</button>`);
   h+='</div>';
 }
 if(q.type==='code'){
   h+=`<input id="codeInput" placeholder="Scrivi la parola decifrata" ${myA!==undefined?'disabled':''}>
   <button ${myA!==undefined?'disabled':''} onclick="codeAnswer()">INVIA</button>`;
 }
 if(q.type==='challenge'){
   h+=`<button ${myA!==undefined?'disabled':''} onclick="answer('FATTO')">FATTO — HO COMPLETATO LA PROVA</button>`;
 }
 if(myA!==undefined&&opA===undefined)h+=`<p class="warning">Hai risposto. Aspetta l'avversario…</p>`;
 if(myA!==undefined&&opA!==undefined){
   if(isHost)h+=`<button onclick="nextRound()">CONTINUA →</button>`;
   else h+=`<p class="success">Entrambi avete risposto. Il creatore della stanza avanza.</p>`;
 }
 document.getElementById('gameArea').innerHTML=h;
}

function answer(v){
 if(state.answers[state.round]?.[myId()]!==undefined)return;
 state.answers[state.round]=state.answers[state.round]||{};
 state.answers[state.round][myId()]=v;
 if(isHost)sendState(); else send({type:'answer',round:state.round,who:myId(),value:v});
 render();
 checkRound();
}
function codeAnswer(){
 let v=(document.getElementById('codeInput').value||'').trim().toUpperCase();
 if(v!=='GIRASOLE'){addLog('❌ Codice errato. Riprova.');return}
 answer(v);
}
function checkRound(){
 const a=state.answers[state.round];
 if(a&&a[myId()]!==undefined&&a[otherId()]!==undefined)addLog('🔥 Entrambi avete completato la prova!');
}
function nextRound(){
 if(!isHost)return;
 if(state.round>=rounds.length-1){state.finished=true;sendState();return}
 state.round++;sendState();
}
function showFinish(){
 document.getElementById('bar').style.width='100%';
 document.getElementById('gameArea').innerHTML=`
 <div style="text-align:center">
 <div style="font-size:70px">🏆</div>
 <h2>FINE DEL DUELLO</h2>
 <p class="challenge">Adesso niente scuse: confrontate le risposte e decidete chi ha vinto.</p>
 <p><b>Il vincitore può chiedere al perdente una richiesta ragionevole.</b></p>
 <p class="muted">Regola ufficiale: niente richieste che mettano l'altro a disagio. Deve essere una cosa che entrambi accettate.</p>
 </div>`;
}
</script>
</body>
</html>
